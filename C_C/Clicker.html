<!DOCTYPE html>
<html lang=en>
<head>
<title>Clicker Game</title>
<meta charset="UTF-8">
</head>
<body>
<p id="numberClicks">Amount=0 </p>
<p id="amountPerSecond">Amount per Second=0 </p>
<p id="rebirthcost" style="position:absolute; top:10px; right: 950px; font-size:20px; font-weight:bold;">[locked]</p>
<img id="cookii" src ="Images/cookii.jpg" alt="Cookie" width="250" height="250"/>
<img id="clickerhelper" src="Images/clickerhelper.jpg" alt="Clicker Helper" width="250" height="100" style="position:absolute; top:100px; right:15px;"/>
<img id="cookieoven" src="Images/cookie_oven.jpg" alt="Cookie Oven" width="250" height="100" style="position:absolute; top:200px; right:15px;"hidden/>
<img id="ClickerBooster1" src="Images/ClickerBooster1.png" alt="Clicker Booster 1" width="25" height="25" style="position:absolute; top:30px; right:15px;" hidden/>
<img id="ClickerBooster2" src="Images/ClickerBooster2.png" alt="Clicker Booster 2" width="25" height="25" style="position:absolute; top:60px; right:15px;" hidden/>
<img id="ClickerBooster3" src="Images/ClickerBooster3.png" alt="Clicker Booster 3" width="25" height="25" style="position:absolute; top:90px; right:15px;" hidden/>
<img id="OvenBooster1" src="Images/OvenBooster1.webp" alt="Oven Booster 1" width="25" height="25" style="position:absolute; top:130px; right:15px;" hidden/>
<img id="OvenBooster2" src="Images/OvenBooster2.png" alt="Oven Booster 2" width="25" height="25" style="position:absolute; top:160px; right:15px;" hidden/>
<img id="OvenBooster3" src="Images/OvenBooster3.jpg" alt="Oven Booster 3" width="25" height="25" style="position:absolute; top:190px; right:15px;" hidden/>
<p id="CB1_Price" hidden>Cost: 500</p>
<p id="CB2_Price" hidden>Cost: 4000</p>
<p id="CB3_Price" hidden>Cost: 10000</p>
<p id="OB1_Price" hidden>Cost: 2000</p>
<p id="OB2_Price" hidden>Cost: 8000</p>
<p id="OB3_Price" hidden>Cost: 20000</p>
<p id="costofclicker" style="position:absolute; top:110px; right:280px; font-size:20px; font-weight:bold;">Cost: 10</p>
<p id="amountofclickers" style="position:absolute; top:125px; right:280px; font-size:20px; font-weight:bold;">Amount: 0</p>
<p id="costofoven" style="position:absolute; top:210px; right:280px; font-size:20px; font-weight:bold;"hidden>Cost: 250</p>
<p id="amountofovens" style="position:absolute; top:225px; right:280px; font-size:20px; font-weight:bold;"hidden>Amount: 0</p>

<style>
    #cookii {
        position :absolute;
        top: 220px;                                           
        left: 125px;
        cursor: pointer;
    }
    #numberClicks {
        position: absolute;
        top: 50px;
        left: 200px;
        font-size: 24px;
        font-weight: bold;
    }
    #clickerhelper {
        cursor: pointer;
    }
    #cookieoven {
        cursor: pointer;
    }
    #cliclkerbooster1 {
        cursor: pointer;
        
    }
    #cliclkerbooster2 {
        cursor: pointer;
    }
    #cliclkerbooster3 {
        cursor: pointer;
    }
    #ovenbooster1 {
        cursor: pointer;
    }
    #ovenbooster2 {
        cursor: pointer;
    }
    #ovenbooster3 {
        cursor: pointer;
    }
</style>
<script>
let priceOfClicker=10;
let amountofclickers=0;
let amountofovens=0;
let priceOfOven=150;
let amountPerSecond=0;
let rebirthprice=1000000;
let amountfromoven=1;
let amountfromclicker=0.1;
let clickerbooster1=false;
let clickerbooster2=false;
let clickerbooster3=false;
let ovenbooster1=false;
let ovenbooster2=false;
let ovenbooster3=false;
let numberOfClicks = 0;

// recalculate passive income based on owned items and per-item rates
function recalcAmountPerSecond(){
    amountPerSecond = amountofclickers * amountfromclicker + amountofovens * amountfromoven;
}

function updateDisplays(){
    // update main displays
    document.getElementById("numberClicks").innerHTML = "Amount="+formatAmount(numberOfClicks);
    document.getElementById("amountPerSecond").innerHTML = "Amount per Second="+formatAmount(amountPerSecond);
    // update shop displays
    document.getElementById("costofclicker").innerHTML = "Cost: "+priceOfClicker;
    document.getElementById("amountofclickers").innerHTML = "Amount: "+amountofclickers;
    document.getElementById("costofoven").innerHTML = "Cost: "+priceOfOven;
    document.getElementById("amountofovens").innerHTML = "Amount: "+amountofovens;
}

// helper to format numbers with at most one decimal place
function formatAmount(n){
    if (Number.isInteger(n)) return String(n);
    return n.toFixed(1);
}

document.getElementById("cookii").addEventListener("mousedown", mouseClicked);
document.getElementById("clickerhelper").addEventListener("mousedown", buyClicker);
document.getElementById("cookieoven").addEventListener("mousedown", buyOven);
document.getElementById("ClickerBooster1").addEventListener("mousedown", getc_booster1);
document.getElementById("ClickerBooster2").addEventListener("mousedown", getc_booster2);
document.getElementById("ClickerBooster3").addEventListener("mousedown", getc_booster3);
document.getElementById("OvenBooster1").addEventListener("mousedown", geto_booster1);
document.getElementById("OvenBooster2").addEventListener("mousedown", geto_booster2);
document.getElementById("OvenBooster3").addEventListener("mousedown", geto_booster3);
setInterval(howmanycookies,100);

// initial display update
recalcAmountPerSecond();
updateDisplays();

function howmanycookies(){
if (numberOfClicks<rebirthprice) {
    document.getElementById("rebirthcost").innerHTML = "[locked]";
} else {
    document.getElementById("rebirthcost").innerHTML = "Cost: " + rebirthprice;
}
if (numberOfClicks<priceOfClicker)
{ document.getElementById("clickerhelper").src = "Images/clickerhelper_toobroke.jpg"; 
} else {
    document.getElementById("clickerhelper").src = "Images/clickerhelper.jpg";
}
if (numberOfClicks<priceOfOven)
{ document.getElementById("cookieoven").style.filter = "grayscale(100%)"; 
} else {
    document.getElementById("cookieoven").style.filter = "none";
}
}
function buyClicker()
{
    if(numberOfClicks>=priceOfClicker)
    {
        ++amountofclickers;
        numberOfClicks-=priceOfClicker;
        priceOfClicker=Math.floor(priceOfClicker*1.1);
        // recalc passive income and refresh displays
        recalcAmountPerSecond();
        updateDisplays();
    }
}

function buyOven()
{
    if(numberOfClicks>=priceOfOven)
    {
        ++amountofovens;
        numberOfClicks-=priceOfOven;
        priceOfOven=Math.floor(priceOfOven*1.1);
        // recalc passive income and refresh displays
        recalcAmountPerSecond();
        updateDisplays();
    }
}

function mouseClicked()
{
    numberOfClicks++;
    updateDisplays();
}

// single global timer: add amountPerSecond once per second
setInterval(function(){
    // add passive income (may be fractional) every second
    if (amountPerSecond !== 0) numberOfClicks += amountPerSecond;
    updateDisplays();
}, 1000);

setInterval (function(){
    // show ClickerBooster1 if at least 10 clickers
    if (!clickerbooster1 && amountofclickers >= 10) {
        document.getElementById("ClickerBooster1").hidden = false;
        clickerbooster1 = true;
    }
        if (!clickerbooster2 && amountofclickers >= 25) {
        // code to show ClickerBooster2 goes here
        clickerbooster2 = true;
    }
        if (!clickerbooster3 && amountofclickers >= 50) {
        // code to show ClickerBooster3 goes here
        clickerbooster3 = true;
    }
        if (numberOfClicks >=120 && amountofovens ===0){
        document.getElementById("cookieoven").hidden = false;
        document.getElementById("costofoven").hidden=false;
        document.getElementById("amountofovens").hidden=false;
        }
    if (!ovenbooster1 && amountofovens >= 10) {
        document.getElementById("OvenBooster1").hidden = false;
        ovenbooster1 = true;
    }
        if (!ovenbooster2 && amountofovens >= 25) {
        // code to show OvenBooster2 goes here
        ovenbooster2 = true;
    }
        if (!ovenbooster3 && amountofovens >= 50) {
        // code to show OvenBooster3 goes here
        ovenbooster3 = true;
    }
}, 500)
    function getc_booster1(){
        if (numberOfClicks >= 500){
            numberOfClicks -= 500;
            // double global clicker rate
            amountfromclicker *= 2;
            // recalc passive income and refresh displays
            recalcAmountPerSecond();
            updateDisplays();
            document.getElementById("ClickerBooster1").hidden = true;
        }
    }
        function getc_booster2(){
        if (numberOfClicks >= 4000){
            numberOfClicks -= 4000;
                amountfromclicker *= 2;
                recalcAmountPerSecond();
                updateDisplays();
            document.getElementById("ClickerBooster2").hidden = true;
        }
    }
        function getc_booster3(){
        if (numberOfClicks >= 10000){
            numberOfClicks -= 10000;
                amountfromclicker *= 2;
                recalcAmountPerSecond();
                updateDisplays();
            document.getElementById("ClickerBooster3").hidden = true;
        }
        }
        function geto_booster1(){
        if (numberOfClicks >= 2000){
            numberOfClicks -= 2000;
                amountfromoven *= 2;
                recalcAmountPerSecond();
                updateDisplays();
            document.getElementById("OvenBooster1").hidden = true;
        }
    }
        function geto_booster2(){
        if (numberOfClicks >= 8000){
            numberOfClicks -= 8000;
                amountfromoven *= 2;
                recalcAmountPerSecond();
                updateDisplays();
            document.getElementById("OvenBooster2").hidden = true;
        }
    }
        function geto_booster3(){
        if (numberOfClicks >= 20000){
            numberOfClicks -= 20000;
                amountfromoven *= 2;
                recalcAmountPerSecond();
                updateDisplays();
            document.getElementById("OvenBooster3").hidden = true;
        }
    }



</script>
</body>
</html>
