<!DOCTYPE html>
</html lang=en>
    <head>
    <title>Exercise 7.3.8 Chessboard </title>
    <meta charset="UTF-8">
    </head>
    <body>
        <h1>Create Grid out of # symbol in console.log</h1>
        <form>
            Height : <input type="number" id="gridHeight" /><br>
            Width: <input type="number" id="gridWidth" /><br>
            <input type="button" onClick="createGrid()" Value="Create Grid" />
        </form>
        <script>
              //start of createGrid function
                            function createGrid(){
                                // get the values from the input boxes
                                let height = parseInt(document.getElementById("gridHeight").value, 10);
                                let width = parseInt(document.getElementById("gridWidth").value, 10);

                                // basic validation and defaults
                                if (!Number.isInteger(height) || height <= 0) height = 8;
                                if (!Number.isInteger(width) || width <= 0) width = 8;

                                let grid = "";
                                // Build a chessboard pattern: alternate '#' and ' ' so that
                                // squares at (i,j) with (i+j) even are '#'.
                                for (let i = 0; i < height; i++) {
                                    for (let j = 0; j < width; j++) {
                                        grid += ((i + j) % 2 === 0) ? "#" : " ";
                                    }
                                    grid += "\n";
                                }

                                // output the grid to console
                                console.log(grid);
                            }
        </script>
    </body>
</html>
