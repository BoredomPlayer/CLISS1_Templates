<!DOCTYPE html>
</html lang=en>
    <head>
    <title>Exercise 7.3.7 GCD </title>
    <meta charset="UTF-8">
    </head>
    <body>
        <h1>Greatest Common Divisor</h1>
        <form>
            1st Number : <input type="number" id="firstNumber" /><br>
            2nd Number: <input type="number" id="secondNumber" /><br>
            <input type="button" onClick="gcd()" Value="Commpute gcd" />
            </form>
            <p>The greatest common divisior is : <br>
            <span id = "result"></span>
            </p>
        <script>
           //start of gcd function
           function gcd(){
               //get the values from the input boxes
               let num1 = parseInt(document.getElementById("firstNumber").value);
               let num2 = parseInt(document.getElementById("secondNumber").value);
               //loop until we find the gcd
               while(num2 != 0){
                   let temp = num2;
                   num2 = num1 % num2;
                   num1 = temp;
               }
               //output the result
               document.getElementById("result").innerText = num1;
           }
        </script>
    </body>
</html>
